<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lettings Dashboard</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
 <header class="topbar">
  <h1>Lettings Dashboard</h1>
  <nav>
    <a href="/" class="active">Dashboard</a>
    <a href="/maintenance.html">Maintenance</a>
  </nav>
  <span id="status" class="status">Connecting...</span>
</header>

  <main>
    <section class="cards">
      <div class="card"><span class="label">Properties</span><span class="value" id="kpi-properties">-</span></div>
      <div class="card"><span class="label">Occupancy</span><span class="value" id="kpi-occupancy">-</span></div>
      <div class="card"><span class="label">Rent collected (2025)</span><span class="value" id="kpi-rent">-</span></div>
    </section>

    <section class="charts">
      <div class="panel">
        <h2>Occupancy by branch (%)</h2>
        <canvas id="occupancy-chart"></canvas>
      </div>
      <div class="panel">
        <h2>Rent collected per month (2025)</h2>
        <canvas id="rent-chart"></canvas>
      </div>
    </section>

    <section class="panel">
      <h2>Branches</h2>
      <table id="branches-table">
        <thead>
          <tr><th>Branch</th><th>Properties</th><th>Avg listed rent</th><th>Occupancy</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="/app.js"></script>
</body>
</html>
