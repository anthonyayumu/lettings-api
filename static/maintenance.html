<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maintenance</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Lettings Dashboard</h1>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/maintenance.html" class="active">Maintenance</a>
       <a href="/reports.html">Reports</a>
    </nav>
    <span class="status"></span>
  </header>

  <main>
    <p id="message" class="message" role="status" hidden></p>

    <section class="panel">
      <h2>Log a repair</h2>
      <form id="create-form" class="form-grid">
        <label>Property ID
          <input type="number" id="property_id" min="1" required>
        </label>
        <label>Category
          <select id="category" required>
            <option>Roof</option>
            <option>Boiler/heating</option>
            <option>Plumbing</option>
            <option>Electrical</option>
            <option>Appliance</option>
            <option>Damp and mould</option>
            <option>Locks/security</option>
            <option>Pest control</option>
          </select>
        </label>
        <label>Priority
          <select id="priority" required>
            <option>Emergency</option>
            <option>Urgent</option>
            <option selected>Routine</option>
          </select>
        </label>
        <label>Reported date (optional)
          <input type="date" id="reported_date">
        </label>
        <button type="submit">Log repair</button>
      </form>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Repairs</h2>
        <select id="status-filter">
          <option value="open">Open</option>
          <option value="resolved">Resolved</option>
          <option value="all">All</option>
        </select>
      </div>
      <table id="repairs-table">
        <thead>
          <tr>
            <th>ID</th><th>Property</th><th>Category</th><th>Priority</th>
            <th>Reported</th><th>Resolved</th><th>Cost</th><th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="pager">
        <button type="button" id="prev">Previous</button>
        <span id="page-info"></span>
        <button type="button" id="next">Next</button>
      </div>
    </section>
  </main>

  <dialog id="resolve-dialog">
    <form id="resolve-form">
      <h2 id="resolve-title">Resolve repair</h2>
      <label>Resolved date
        <input type="date" id="resolved_date" required>
      </label>
      <label>Cost (£)
        <input type="number" id="cost" min="0" step="0.01" required>
      </label>
      <div class="dialog-actions">
        <button type="button" id="resolve-cancel" class="secondary">Cancel</button>
        <button type="submit">Resolve</button>
      </div>
    </form>
  </dialog>

  <script src="/api.js"></script>
  <script src="/maintenance.js"></script>
</body>
</html>
